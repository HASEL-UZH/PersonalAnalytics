name: Build and Publish PersonalAnalytics
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  NODE_VERSION: 24

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/electron
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: macos-15
            mac_arch: arm64
          - os: macos-15-intel
            mac_arch: x64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci
      - name: Install Electron binary
        run: npx install-electron --no
      - name: Test
        run: npm test
      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.mac_arch }}" ]; then
            if [ "${{ matrix.mac_arch }}" == "arm64" ]; then
              npm run build:mac:arm64
            else
              npm run build:mac:x64
            fi
          else
            npm run build
          fi
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          MAC_ARCH_TYPE: ${{ matrix.mac_arch == 'arm64' && 'AppleSilicon' || 'Intel' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_CODE_SIGNING_NAME: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      # each mac job publishes its own latest-mac.yml and the last one overwrites the other,
      # so we keep both and merge them in the merge-mac-update-info job below
      - name: Upload latest-mac.yml for merging
        if: matrix.mac_arch
        uses: actions/upload-artifact@v4
        with:
          name: latest-mac-${{ matrix.mac_arch }}
          path: src/electron/release/*/latest-mac.yml
          if-no-files-found: error

  merge-mac-update-info:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: latest-mac-*
      - name: Merge arm64 and x64 latest-mac.yml and upload to release
        run: |
          VERSION=$(jq -r .version src/electron/package.json)
          for arch in arm64 x64; do
            if [ "$(yq '.version' latest-mac-$arch/latest-mac.yml)" != "$VERSION" ]; then
              echo "latest-mac-$arch/latest-mac.yml does not match version $VERSION" && exit 1
            fi
          done
          # x64 stays the top-level path (fallback for old updaters), arm64 Macs pick the arm64 entry from files
          yq '.files += load("latest-mac-arm64/latest-mac.yml").files' latest-mac-x64/latest-mac.yml > latest-mac.yml
          cat latest-mac.yml
          # make sure we never publish a manifest that leaves one architecture without an update
          if [ "$(yq '[.files[].url | select(test("arm64.*[.]zip$"))] | length' latest-mac.yml)" != "1" ] || \
             [ "$(yq '[.files[].url | select(test("x64.*[.]zip$"))] | length' latest-mac.yml)" != "1" ]; then
            echo "merged latest-mac.yml must contain exactly one arm64 and one x64 zip" && exit 1
          fi
          gh release upload "v$VERSION" latest-mac.yml --clobber --repo ${{ github.repository }}
